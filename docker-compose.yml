version: "3.8"
services:
  videl:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    restart: unless-stopped
    volumes: ["./videl.db:/app/videl.db", "./downloads:/app/downloads"]
    environment:
      - PORT=8000
      - ENV=production

  # optional: Vercel handles webapp in prod; this is for local dev
  webapp:
    image: node:20-slim
    working_dir: /app
    command: bash -c "cd webapp && npm install && npm run dev -- -p 3001 -H 0.0.0.0"
    ports: ["3001:3001"]
    volumes: ["./webapp:/app/webapp"]
    profiles: ["dev"]
