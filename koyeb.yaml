# Koyeb — videl perfect • docker • single PORT (videl owns it)
services:
  - name: videl-perfect
    type: web
    instance_type: nano
    regions: [sin]
    docker:
      dockerfile: Dockerfile
    env:
      API_ID: ""
      API_HASH: ""
      BOT_TOKEN: ""
      STRING_SESSION: ""
      MONGO_DB_URL: ""
      OWNER_ID: ""
      PORT: "10000"
      CYBER_DARK: "1"
    health_check:
      path: /health
      port: 10000
