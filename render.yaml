services:
  - type: web
    name: videl-perfect
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: MONGO_DB_URL
        sync: false
      - key: OWNER_ID
        value: "6265999542"
      - key: WEBAPP_SECRET
        sync: false
      - key: WEBAPP_URL
        value: https://videl-studio.vercel.app
      - key: ELDIAN_API_URL
        sync: false
      - key: ELDIAN_API_KEY
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: PORT
        value: "10000"
      # KEEPALIVE_PORT intentionally NOT set on Render — single port → only videl Flask owns 10000
      # For VPS two-port setup, set KEEPALIVE_PORT=8000
      # MongoDB only — Supabase/Dropbox removed
      - key: CYBER_DARK
        value: "1"
      - key: ENV
        value: "production"
